<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Stock Screeners - HHMA</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        body { 
            background-color: #131722; color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; margin: 0;
        }
        .container { max-width: 1400px; margin: auto; }
        h1 { text-align: center; color: #00ffaa; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 0.9em; }
        
        /* TABEL LEBAR & TEKS TIDAK PECAH */
        table.dataTable {
            width: 100% !important;
            background-color: #1e222d !important;
            color: white !important;
            border-radius: 8px;
            overflow: hidden;
            border: none !important;
        }
        table.dataTable thead th {
            background-color: #2a2e39 !important;
            color: #00ffaa !important;
            white-space: nowrap; 
            padding: 15px !important;
            border-bottom: 1px solid #3d4352 !important;
        }
        table.dataTable tbody td {
            white-space: nowrap; 
            padding: 12px 15px !important;
            border-bottom: 1px solid #2a2e39 !important;
            text-align: center !important;
        }
        .dataTables_wrapper .dataTables_filter input, .dataTables_wrapper .dataTables_length select {
            color: white !important;
            background-color: #2a2e39 !important;
            border: 1px solid #3d4352 !important;
            padding: 5px; border-radius: 4px;
        }

        /* MODAL & FIX TOMBOL CLOSE */
        .modal {
            display: none; position: fixed; 
            z-index: 9999; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.9);
        }
        .modal-content {
            background-color: #1e222d;
            margin: 2% auto; padding: 10px;
            border: 1px solid #00ffaa; border-radius: 8px;
            width: 90%; height: 85vh;
            position: relative; 
        }
        .close {
            position: absolute; right: 15px; top: 5px;
            color: #ff4444; font-size: 35px; font-weight: bold;
            cursor: pointer; z-index: 10001;
            background: #1e222d; padding: 0 10px; border-radius: 50%;
        }
        .close:hover { color: #fff; background: #ff4444; }

        .buy-text { color: #00ffaa; font-weight: bold; }
        .sell-text { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👑 HHMA Strategy Screener</h1>
        <div class="subtitle">Tahan SHIFT + Klik Header untuk Multiple Sort | Klik Ticker untuk Buka Chart</div>
        
        </div>

    <div id="tv-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="close-modal-btn">&times;</span>
            <div id="tv-widget-container" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <script>
        // 1. INISIALISASI DATATABLES (MULTIPLE SORT & PENCARIAN)
        $(document).ready(function() {
            $('table').DataTable({
                "pageLength": 50,
                "order": [[ 1, "desc" ]], // Default urut berdasarkan Tanggal
                "language": {
                    "search": "Cari Saham:",
                    "lengthMenu": "Tampilkan _MENU_ data"
                }
            });
        });

        // 2. WIDGET TRADINGVIEW + INDIKATOR AROON & STOCHASTIC
        function openWidget(ticker) {
            document.getElementById('tv-modal').style.display = "block";
            new TradingView.widget({
                "autosize": true,
                "symbol": "IDX:" + ticker,
                "interval": "D",
                "timezone": "Asia/Jakarta",
                "theme": "dark",
                "style": "1",
                "locale": "id",
                "container_id": "tv-widget-container",
                "studies": [
                    { "id": "Aroon@tv-basicstudies", "inputs": { "length": 8 } },
                    "Stochastic@tv-basicstudies"
                ]
            });
        }

        // 3. LOGIKA TOMBOL CLOSE MODAL
        const modal = document.getElementById('tv-modal');
        const closeBtn = document.getElementById('close-modal-btn');

        closeBtn.onclick = function() {
            modal.style.display = "none";
            document.getElementById('tv-widget-container').innerHTML = ''; // Matikan chart
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
                document.getElementById('tv-widget-container').innerHTML = '';
            }
        }
    </script>
</body>
</html>
