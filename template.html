<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screener Lorentzian Kernel 👑</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

    <style>
        body { background-color: #131722; color: white; font-family: sans-serif; padding: 20px; }
        .container { max-width: 1500px; margin: auto; }
        h1 { text-align: center; color: #00ffaa; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; }
        
        table.dataTable { width: 100% !important; background-color: #1e222d !important; color: white !important; }
        table.dataTable thead th { background-color: #2a2e39 !important; color: #00ffaa !important; white-space: nowrap; }
        table.dataTable tbody td { white-space: nowrap; border-bottom: 1px solid #2a2e39 !important; text-align: center !important; }
        
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { background-color: #1e222d; margin: 2% auto; padding: 10px; border: 1px solid #00ffaa; width: 90%; height: 85vh; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; color: #ff4444; font-size: 40px; cursor: pointer; z-index: 10001; }
        
        .buy { color: #00ffaa; font-weight: bold; }
        .sell { color: #ff4444; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Screener Lorentzian Kernel 👑</h1>
        <div class="subtitle">Update Otomatis | Tahan SHIFT untuk Multiple Sort | Klik Ticker untuk Chart</div>
        
        </div>

    <div id="tv-modal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeBtn">&times;</span>
            <div id="tv-container" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            $('table').DataTable({ "pageLength": 100, "order": [[ 2, "asc" ]] });
        });

        function openChart(ticker) {
            document.getElementById('tv-modal').style.display = "block";
            new TradingView.widget({
                "autosize": true, "symbol": "IDX:" + ticker, "interval": "D", "timezone": "Asia/Jakarta",
                "theme": "dark", "style": "1", "locale": "id", "container_id": "tv-container",
                "studies": [ { "id": "Aroon@tv-basicstudies", "inputs": { "length": 8 } }, "Stochastic@tv-basicstudies" ]
            });
        }

        document.getElementById('closeBtn').onclick = function() {
            document.getElementById('tv-modal').style.display = "none";
            document.getElementById('tv-container').innerHTML = '';
        }
    </script>
</body>
</html>
